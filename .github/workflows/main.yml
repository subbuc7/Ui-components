name: Daily 3D UI Generator

on:
  schedule:
    # Runs daily at 5:00 AM IST (23:30 UTC)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows you to run it manually anytime to test

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Component
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-component.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add components/
          git commit -m "Add 3D UI component - $(date +'%Y-%m-%d')" || exit 0
          git push
          
