      name: Create Instagram Container
        id: create_container
        env:
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.upload_video.outputs.video_url }}
          COMPONENT_TITLE: ${{ steps.selector.outputs.title }}
        run: |
          if [ -z "$IG_USER_ID" ]; then
            echo "ERROR: INSTAGRAM_USER_ID (or INSTAGRAM_ACCOUNT_ID) secret is missing in this repo!"
            exit 1
          fi

          CAPTION="3D UI Design: ${COMPONENT_TITLE} ⚡ Rendered automatically. #3dui #webdev #threejs #uidesign #motiongraphics"

          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v20.0/${IG_USER_ID}/media" \
            -F "media_type=REELS" \
            -F "video_url=${VIDEO_URL}" \
            -F "caption=${CAPTION}" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          CONTAINER_ID=$(echo $RESPONSE | jq -r '.id')
          if [ "$CONTAINER_ID" = "null" ] || [ -z "$CONTAINER_ID" ]; then
            echo "Failed to create Instagram container: $RESPONSE"
            exit 1
          fi

          echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT

      - name: Poll Container Status Until Ready
        env:
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONTAINER_ID: ${{ steps.create_container.outputs.container_id }}
        run: |
          echo "Waiting for Instagram to process video..."
          STATUS="IN_PROGRESS"
          for i in {1..30}; do
            CHECK=$(curl -s "https://graph.facebook.com/v20.0/${CONTAINER_ID}?fields=status_code&access_token=${IG_ACCESS_TOKEN}")
            STATUS_CODE=$(echo $CHECK | jq -r '.status_code')
            echo "Status: $STATUS_CODE"

            if [ "$STATUS_CODE" = "FINISHED" ]; then
              STATUS="FINISHED"
              break
            elif [ "$STATUS_CODE" = "ERROR" ]; then
              echo "Processing failed: $CHECK"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATUS" != "FINISHED" ]; then
            echo "Timed out waiting for video processing."
            exit 1
          fi

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONTAINER_ID: ${{ steps.create_container.outputs.container_id }}
        run: |
          RES=$(curl -s -X POST "https://graph.facebook.com/v20.0/${IG_USER_ID}/media_publish" \
            -F "creation_id=${CONTAINER_ID}" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          MEDIA_ID=$(echo $RES | jq -r '.id')
          if [ "$MEDIA_ID" = "null" ] || [ -z "$MEDIA_ID" ]; then
            echo "Failed to publish: $RES"
            exit 1
          fi

          echo "Successfully published to Instagram! Media ID: $MEDIA_ID"
          
