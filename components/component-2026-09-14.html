<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Luxury Dock</title>
  <style>
    /* --- RESET & LUXURY SYSTEM VARIABLES --- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-base: #030407;
      --gold-100: #fff8d6;
      --gold-300: #f3d078;
      --gold-500: #d4af37;
      --gold-700: #996515;
      --gold-900: #4a3204;
      --titanium: #8a96a3;
      --glass-bg: rgba(15, 18, 28, 0.45);
      --glass-border: rgba(212, 175, 55, 0.22);
      --glass-specular: rgba(255, 245, 200, 0.15);
      --shadow-ambient: 0 35px 80px rgba(0, 0, 0, 0.85);
      --shadow-gold: 0 0 35px rgba(212, 175, 55, 0.25);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* --- CANVAS BACKGROUND --- */
    #ambientCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* --- STAGE & WRAPPER --- */
    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
    }

    /* --- BRANDING HEADER --- */
    .brand-header {
      position: absolute;
      top: 10%;
      text-align: center;
      pointer-events: none;
      transform: translateZ(20px);
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .brand-title {
      font-size: 0.75rem;
      letter-spacing: 0.65em;
      text-transform: uppercase;
      color: var(--gold-500);
      font-weight: 600;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      margin-bottom: 6px;
      display: block;
    }

    .brand-sub {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--titanium);
      opacity: 0.6;
    }

    /* --- DOCK PERSPECTIVE CONTAINER --- */
    .dock-perspective {
      position: relative;
      padding: 40px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* --- 3D DOCK CONTAINER --- */
    .dock-container {
      position: relative;
      height: 88px;
      padding: 0 18px;
      background: var(--glass-bg);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        var(--shadow-ambient),
        var(--shadow-gold),
        inset 0 1px 1px var(--glass-specular),
        inset 0 -1px 2px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      transform-style: preserve-3d;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .dock-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,245,200,0.4), rgba(212,175,55,0.05) 40%, rgba(0,0,0,0.6));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Dynamic Glare Overlay */
    .dock-glare {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(
        800px circle at var(--glare-x, 50%) var(--glare-y, 0%),
        rgba(255, 245, 200, 0.12),
        transparent 40%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* --- LIQUID GOLD INDICATOR --- */
    .liquid-indicator {
      position: absolute;
      top: 50%;
      left: 0;
      height: 60px;
      width: 60px;
      margin-top: -30px;
      pointer-events: none;
      z-index: 1;
      transform-style: preserve-3d;
      will-change: transform, width;
    }

    .liquid-blob {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold-100) 0%, var(--gold-500) 45%, var(--gold-700) 100%);
      box-shadow: 
        0 0 25px rgba(212, 175, 55, 0.6),
        0 8px 20px rgba(0, 0, 0, 0.4),
        inset 0 2px 3px rgba(255, 255, 255, 0.8),
        inset 0 -2px 5px rgba(74, 50, 4, 0.6);
      position: relative;
      overflow: hidden;
      transition: border-radius 0.3s ease;
    }

    /* Animated Gold Metallic Fluid Inside Indicator */
    .liquid-blob::after {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.4) 60deg,
        transparent 120deg,
        rgba(255, 248, 214, 0.6) 180deg,
        transparent 240deg
      );
      animation: rotateFluid 6s linear infinite;
    }

    @keyframes rotateFluid {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Subtle Liquid Surface Light Wave */
    .liquid-blob::before {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 60%);
      z-index: 2;
    }

    /* --- DOCK ITEMS --- */
    .dock-items-list {
      display: flex;
      align-items: center;
      gap: 12px;
      list-style: none;
      position: relative;
      z-index: 3;
      transform-style: preserve-3d;
    }

    .dock-item {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 18px;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.15s ease-out;
    }

    .icon-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dock-item svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
      transition: filter 0.3s ease;
    }

    /* Icon Colors based on state */
    .dock-item .icon-path {
      fill: url(#gold-metallic-grad);
      transition: fill 0.3s ease;
    }

    .dock-item:not(.active) .icon-path {
      fill: url(#titanium-grad);
    }

    .dock-item:hover:not(.active) .icon-path {
      fill: url(#gold-light-grad);
    }

    .dock-item.active svg {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 8px rgba(255, 248, 214, 0.8));
    }

    /* Tooltip styling */
    .tooltip {
      position: absolute;
      top: -48px;
      padding: 6px 14px;
      background: rgba(10, 12, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--gold-100);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px) translateZ(30px) scale(0.9);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.15);
      white-space: nowrap;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 7px;
      height: 7px;
      background: rgba(10, 12, 18, 0.85);
      border-right: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
    }

    .dock-item:hover .tooltip {
      opacity: 1;
      transform: translateY(0) translateZ(30px) scale(1);
    }

    /* Micro-Indicator Dot underneath unselected active hover */
    .dot-indicator {
      position: absolute;
      bottom: -6px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold-500);
      box-shadow: 0 0 8px var(--gold-500);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dock-item.active .dot-indicator {
      opacity: 1;
      transform: scale(1);
      background: #fff;
      box-shadow: 0 0 10px #fff, 0 0 18px var(--gold-500);
    }

    /* --- REALISTIC FLOOR REFLECTION --- */
    .dock-reflection {
      position: absolute;
      top: 100%;
      left: 18px;
      right: 18px;
      height: 88px;
      margin-top: 12px;
      background: var(--glass-bg);
      border-radius: 28px;
      transform: scaleY(-1) rotateX(25deg);
      transform-origin: top center;
      opacity: 0.18;
      filter: blur(6px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 80%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 80%);
      pointer-events: none;
      z-index: -1;
    }

    /* --- RESPONSIVE TOUCH ADJUSTMENTS --- */
    @media (max-width: 600px) {
      .dock-container {
        height: 76px;
        padding: 0 12px;
      }
      .dock-item {
        width: 48px;
        height: 48px;
      }
      .liquid-indicator {
        height: 48px;
        width: 48px;
        margin-top: -24px;
      }
      .dock-items-list {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Golden Dust Canvas -->
  <canvas id="ambientCanvas"></canvas>

  <!-- Global SVG Gradients -->
  <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
    <defs>
      <!-- Rich Gold Gradient -->
      <linearGradient id="gold-metallic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF8D6" />
        <stop offset="45%" stop-color="#D4AF37" />
        <stop offset="80%" stop-color="#AA7C11" />
        <stop offset="100%" stop-color="#5B4006" />
      </linearGradient>

      <!-- Platinum/Titanium Gradient -->
      <linearGradient id="titanium-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E2E8F0" />
        <stop offset="50%" stop-color="#94A3B8" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>

      <!-- Bright Gold Light Gradient -->
      <linearGradient id="gold-light-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="50%" stop-color="#F3D078" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
    </defs>
  </svg>

  <div class="stage">
    
    <!-- Branding Header -->
    <div class="brand-header" id="brandHeader">
      <span class="brand-title">A E T H E R</span>
      <span class="brand-sub">Kinetic OS &bull; Edition V</span>
    </div>

    <!-- 3D Perspective Wrapper -->
    <div class="dock-perspective" id="perspectiveWrapper">
      
      <!-- Main Dock -->
      <div class="dock-container" id="dockContainer">
        
        <div class="dock-glare" id="dockGlare"></div>

        <!-- Dynamic Liquid Gold Capsule -->
        <div class="liquid-indicator" id="liquidIndicator">
          <div class="liquid-blob"></div>
        </div>

        <!-- Interactive Dock Items -->
        <ul class="dock-items-list" id="dockList">
          
          <!-- Item 1: Sanctuary -->
          <li class="dock-item active" data-title="Sanctuary" data-index="0">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M12 2.5L2 9.5V21C2 21.5523 2.44772 22 3 22H9V15H15V22H21C21.5523 22 22 21.5523 22 21V9.5L12 2.5ZM12 5.2L19.5 10.45V20H16.5V13.5C16.5 12.9477 16.0523 12.5 15.5 12.5H8.5C7.94772 12.5 7.5 12.9477 7.5 13.5V20H4.5V10.45L12 5.2Z"/>
              </svg>
            </div>
            <div class="tooltip">Sanctuary</div>
            <div class="dot-indicator"></div>
          </li>

          <!-- Item 2: Vault -->
          <li class="dock-item" data-title="Vault" data-index="1">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 3.18L19 6.3V11C19 15.52 16.02 19.69 12 20.88C7.98 19.69 5 15.52 5 11V6.3L12 3.18ZM12 7C9.79 7 8 8.79 8 11C8 12.5 8.83 13.81 10 14.49V17H14V14.49C15.17 13.81 16 12.5 16 11C16 8.79 14.21 7 12 7ZM12 9C13.1 9 14 9.9 14 11C14 12.1 13.1 13 12 13C10.9 13 10 12.1 10 11C10 9.9 10.9 9 12 9Z"/>
              </svg>
            </div>
            <div class="tooltip">Vault</div>
            <div class="dot-indicator"></div>
          </li>

          <!-- Item 3: Analytics / Pulse -->
          <li class="dock-item" data-title="Analytics" data-index="2">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM7 10H9V17H7V10ZM11 7H13V17H11V7ZM15 13H17V17H15V13Z"/>
              </svg>
            </div>
            <div class="tooltip">Analytics</div>
            <div class="dot-indicator"></div>
          </li>

          <!-- Item 4: Privé / Concierge -->
          <li class="dock-item" data-title="Concierge" data-index="3">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M12 2L14.8 8.2L21.6 8.7L16.4 13.2L18 19.8L12 16.2L6 19.8L7.6 13.2L2.4 8.7L9.2 8.2L12 2ZM12 5.5L10 9.9L5.2 10.3L8.9 13.5L7.8 18.2L12 15.6L16.2 18.2L15.1 13.5L18.8 10.3L14 9.9L12 5.5Z"/>
              </svg>
            </div>
            <div class="tooltip">Concierge</div>

          </li>

          <!-- Item 5: Chrono / Precision -->
          <li class="dock-item" data-title="Chrono" data-index="4">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM12.5 7H11V13L16.2 16.2L17 14.9L12.5 12.2V7Z"/>
              </svg>

          </li>

          <!-- Item 6: Control / Settings -->
          <li class="dock-item" data-title="Settings" data-index="5">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24">
                <path class="icon-path" d="M19.14 12.94C19.18 12.63 19.2 12.32 19.2 12C19.2 11.68 19.18 11.37 19.14 11.06L21.16 9.48C21.34 9.34 21.39 9.09 21.28 8.89L19.38 5.59C19.26 5.39 19.02 5.31 18.81 5.39L16.43 6.35C15.94 5.98 15.4 5.67 14.82 5.43L14.46 2.9C14.42 2.68 14.23 2.5 14 2.5H10C9.77 2.5 9.58 2.68 9.54 2.9L9.18 5.43C8.6 5.67 8.06 5.98 7.57 6.35L5.19 5.39C4.98 5.3 4.74 5.39 4.62 5.59L2.72 8.89C2.61 9.09 2.66 9.34 2.84 9.48L4.86 11.06C4.82 11.37 4.8 11.69 4.8 12C4.8 12.31 4.82 12.63 4.86 12.94L2.84 14.52C2.66 14.66 2.61 14.91 2.72 15.11L4.62 18.41C4.74 18.61 4.98 18.7 5.19 18.61L7.57 17.65C8.06 18.02 8.6 18.33 9.18 18.57L9.54 21.1C9.58 21.32 9.77 21.5 10 21.5H14C14.23 21.5 14.42 21.32 14.46 21.1L14.82 18.57C15.4 18.33 15.94 18.02 16.43 17.65L18.81 18.61C19.02 18.7 19.26 18.61 19.38 18.41L21.28 15.11C21.4 14.91 21.34 14.66 21.16 14.52L19.14 12.94ZM12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5Z"/>
              </svg>
            </div>
            <div class="tooltip">Settings</div>
            <div class="dot-indicator"></div>

        </ul>

        <!-- Mirror Reflection -->
        <div class="dock-reflection"></div>

      </div>
    </div>
  </div>

  <script>
    /**
     * ULTRA-PREMIUM KINETIC DOCK ENGINE
     * Handles 3D tilt physics, mac-style dynamic proximity magnification,
     * spring-driven liquid morphing indicator, and luxury ambient particle system.
     */

    // --- Ambient Particle Canvas System ---
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class GoldParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.3;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = -Math.random() * 0.4 - 0.1;
        this.alpha = Math.random() * 0.6 + 0.1;
        this.life = Math.random() * 300 + 100;
        this.maxLife = this.life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        if (this.life <= 0 || this.y < 0) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        const currentAlpha = (this.life / this.maxLife) * this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${currentAlpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(212, 175, 55, 0.8)";
        ctx.fill();
      }
    }

    // Spawn dust particles
    for (let i = 0; i < 45; i++) {
      particles.push(new GoldParticle());
    }

    // Dynamic Click Gold Burst Effect
    function createBurst(x, y) {
      for (let i = 0; i < 16; i++) {
        const p = new GoldParticle();
        p.x = x;
        p.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        p.size = Math.random() * 2.5 + 1;
        p.life = 60;
        p.maxLife = 60;
        particles.push(p);
      }
    }

    // --- Interactive Physics & 3D Tilt Setup ---
    const perspectiveWrapper = document.getElementById('perspectiveWrapper');
    const dockContainer = document.getElementById('dockContainer');
    const dockGlare = document.getElementById('dockGlare');
    const brandHeader = document.getElementById('brandHeader');
    const dockList = document.getElementById('dockList');
    const items = Array.from(document.querySelectorAll('.dock-item'));
    const liquidIndicator = document.getElementById('liquidIndicator');

    // State Variables
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetRotateX = 0;
    let targetRotateY = 0;
    let currentRotateX = 0;
    let currentRotateY = 0;

    // Liquid Indicator Physics State
    let targetIndicatorX = 0;
    let currentIndicatorX = 0;
    let indicatorVelocity = 0;
    let activeIndex = 0;

    // Magnification Radius
    const maxScale = 1.45;
    const maxTranslateZ = 35;
    const effectRadius = 160;

    // Update active liquid indicator position based on selected item
    function updateActiveIndicator(index, immediate = false) {
      activeIndex = index;
      items.forEach((item, i) => {
        if (i === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      const activeItem = items[index];
      const dockRect = dockContainer.getBoundingClientRect();
      const itemRect = activeItem.getBoundingClientRect();
      
      // Calculate relative X inside dock
      targetIndicatorX = itemRect.left - dockRect.left;

      if (immediate) {
        currentIndicatorX = targetIndicatorX;
      }
    }

    // Initialize indicator position
    setTimeout(() => {
      updateActiveIndicator(0, true);
    }, 50);

    // Track Mouse Coordinates
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // Calculate Dock Tilt (-1 to 1)
      const rect = dockContainer.getBoundingClientRect();
      const dockCenterX = rect.left + rect.width / 2;
      const dockCenterY = rect.top + rect.height / 2;

      const deltaX = (mouseX - dockCenterX) / (window.innerWidth / 2);
      const deltaY = (mouseY - dockCenterY) / (window.innerHeight / 2);

      targetRotateY = deltaX * 16; // Max 16deg Y tilt
      targetRotateX = -deltaY * 16; // Max 16deg X tilt

      // Glare Spot Relative Position
      const glareX = ((e.clientX - rect.left) / rect.width) * 100;
      const glareY = ((e.clientY - rect.top) / rect.height) * 100;
      dockGlare.style.setProperty('--glare-x', `${glareX}%`);
      dockGlare.style.setProperty('--glare-y', `${glareY}%`);
    });

    // Touch Support
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    });

    // Click micro-interactions
    items.forEach((item, index) => {
      item.addEventListener('click', (e) => {
        updateActiveIndicator(index);
        createBurst(e.clientX, e.clientY);

        // Haptic Feedback visual micro bounce
        item.style.transform = `scale(0.9) translateZ(10px)`;
        setTimeout(() => {
          item.style.transform = '';
        }, 150);
      });
    });

    // Main Kinetic Animation Loop
    function animate() {
      // 1. Render Particle Background
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.update();
        p.draw();
        if (p.life <= 0 && particles.length > 45) {
          particles.splice(idx, 1);
        }
      });

      // 2. Smooth Lerp 3D Dock Tilt Physics
      currentRotateX += (targetRotateX - currentRotateX) * 0.08;
      currentRotateY += (targetRotateY - currentRotateY) * 0.08;

      dockContainer.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
      brandHeader.style.transform = `translate3d(${currentRotateY * 1.5}px, ${-currentRotateX * 1.5}px, 20px)`;

      // 3. Liquid Gold Indicator Spring Physics
      const force = (targetIndicatorX - currentIndicatorX) * 0.18;
      indicatorVelocity = (indicatorVelocity + force) * 0.72; // Spring + Friction
      currentIndicatorX += indicatorVelocity;

      // Stretch dynamic morph based on velocity
      const stretch = Math.min(Math.abs(indicatorVelocity) * 0.022, 0.45);
      const scaleX = 1 + stretch;
      const scaleY = 1 - stretch * 0.6;

      liquidIndicator.style.transform = `translate3d(${currentIndicatorX}px, 0, 10px) scale(${scaleX}, ${scaleY})`;

      // 4. Proximity Icon Magnification Physics (macOS Dock Effect)
      items.forEach((item) => {
        const itemRect = item.getBoundingClientRect();
        const itemCenterX = itemRect.left + itemRect.width / 2;
        const itemCenterY = itemRect.top + itemRect.height / 2;

        const dist = Math.hypot(mouseX - itemCenterX, mouseY - itemCenterY);

        if (dist < effectRadius) {
          const factor = Math.cos((dist / effectRadius) * (Math.PI / 2)); // Smooth cosine curve
          const scale = 1 + (maxScale - 1) * factor;
          const translateZ = maxTranslateZ * factor;
          const translateY = -14 * factor;

          item.style.transform = `translate3d(0, ${translateY}px, ${translateZ}px) scale(${scale})`;
        } else {
          item.style.transform = `translate3d(0, 0, 0) scale(1)`;
        }
      });

      requestAnimationFrame(animate);
    }

    // Start Engine
    animate();

    // Recalculate indicator position on window resize
    window.addEventListener('resize', () => {
      updateActiveIndicator(activeIndex, true);
    });
  </script>
</body>
